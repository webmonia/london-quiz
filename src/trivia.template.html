<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="author" content="Стефан Илчев, 4 Д клас">
<title>Викторина: Лондон и Англия</title>
<style>
/* ===== Шрифтове (вградени, работят без интернет) ===== */
@font-face {
  font-family: 'Nunito'; font-style: normal; font-weight: 400 900; font-display: swap;
  src: url("{{FONT_NUNITO_CYRILLIC}}") format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
}
@font-face {
  font-family: 'Nunito'; font-style: normal; font-weight: 400 900; font-display: swap;
  src: url("{{FONT_NUNITO_LATIN}}") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Unbounded'; font-style: normal; font-weight: 500 900; font-display: swap;
  src: url("{{FONT_UNBOUNDED_CYRILLIC}}") format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
}
@font-face {
  font-family: 'Unbounded'; font-style: normal; font-weight: 500 900; font-display: swap;
  src: url("{{FONT_UNBOUNDED_LATIN}}") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

/* ===== Цветове и основни настройки ===== */
:root {
  --paper: #F5EEE1;
  --paper-deep: #EADFC9;
  --card: #FFFCF6;
  --ink: #13213F;
  --ink-soft: #4A5675;
  --red: #D7192D;
  --red-deep: #A8101F;
  --red-tint: #FCE6E7;
  --navy: #0E2A5C;
  --navy-tint: #E4EBF6;
  --sky: #CFE5F2;
  --sky-deep: #9DC1DA;
  --river: #5B8DB8;
  --green: #0A8A45;
  --green-tint: #E1F4E8;
  --gold: #F4B400;
  --gold-tint: #FFF2CC;
  --road: #39404F;
  --line: rgba(19, 33, 63, .14);
  --shadow-sm: 0 1px 0 rgba(19, 33, 63, .08), 0 6px 14px -8px rgba(19, 33, 63, .3);
  --shadow: 0 1px 0 rgba(19, 33, 63, .06), 0 22px 44px -22px rgba(19, 33, 63, .45);
  --font-display: 'Unbounded', 'Nunito', 'Segoe UI', sans-serif;
  --font-body: 'Nunito', 'Segoe UI', sans-serif;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --bus-w: 84px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.5;
  color: var(--ink);
  background:
    radial-gradient(1100px 560px at 90% -10%, rgba(207, 229, 242, .95), transparent 60%),
    radial-gradient(900px 520px at -10% 110%, rgba(252, 230, 231, .9), transparent 60%),
    var(--paper);
  background-attachment: fixed;
  overflow-x: hidden;
}
/* Лека „хартиена“ текстура */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .55;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.07 0 0 0 0 0.13 0 0 0 0 0.25 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
button, input { font: inherit; }
h1, h2, h3, p { overflow-wrap: break-word; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

/* Шарена ивица като линиите на метрото */
.tube-stripe {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 6px;
  z-index: 20;
  background: linear-gradient(90deg,
    #DC241F 0 20%, #0019A8 20% 40%, #00782A 40% 60%, #FFC80A 60% 80%, #9B0056 80% 100%);
}

/* ===== Горна лента ===== */
.topbar {
  position: relative;
  z-index: 2;
  max-width: 980px;
  margin: 0 auto;
  padding: 24px 20px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.brand__mark {
  position: relative;
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 7px solid var(--red);
}
.brand__mark::after {
  content: '';
  position: absolute;
  left: -12px; right: -12px; top: 50%;
  height: 8px;
  transform: translateY(-50%);
  background: var(--navy);
  border-radius: 1px;
}

.lang-switch {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 2px solid var(--ink);
  background: var(--card);
  box-shadow: 0 4px 0 var(--ink);
  color: var(--ink-soft);
  font-weight: 900;
  font-size: 14px;
  cursor: pointer;
  transition: transform .15s var(--ease-out), box-shadow .15s;
}
.lang-switch:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.lang-switch:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.lang-switch__opt {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  opacity: .5;
  transition: opacity .2s, color .2s;
}
.lang-switch__opt.is-on { opacity: 1; color: var(--ink); }
.lang-switch__flag {
  display: block;
  width: 22px;
  height: 14px;
  border-radius: 3px;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .15);
}
.lang-switch__track {
  position: relative;
  width: 46px;
  height: 26px;
  border-radius: 999px;
  background: var(--navy);
  transition: background .3s;
}
.lang-switch__knob {
  position: absolute;
  top: 3px; left: 3px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 4px rgba(0, 0, 0, .3);
  transition: transform .35s var(--ease-out);
}
.lang-switch[aria-checked="true"] .lang-switch__track { background: var(--red); }
.lang-switch[aria-checked="true"] .lang-switch__knob { transform: translateX(20px); }

/* ===== Екрани ===== */
.app {
  position: relative;
  z-index: 1;
  max-width: 980px;
  margin: 0 auto;
  padding: 10px 20px 56px;
}
.screen { display: none; }
.screen.is-active { display: block; animation: screenIn .55s var(--ease-out) both; }

/* ===== Бутони ===== */
.btn {
  appearance: none;
  border: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-weight: 900;
  font-size: 18px;
  line-height: 1;
  padding: 16px 26px;
  border-radius: 999px;
  transition: transform .15s var(--ease-out), box-shadow .15s, background .2s;
}
.btn svg { width: 22px; height: 22px; flex: none; }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
.btn--primary {
  background: var(--red);
  color: #fff;
  box-shadow: 0 6px 0 var(--red-deep), 0 16px 26px -14px rgba(168, 16, 31, .8);
}
.btn--primary:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--red-deep), 0 20px 30px -14px rgba(168, 16, 31, .8); }
.btn--primary:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--red-deep); }
.btn--ghost {
  background: var(--card);
  color: var(--ink);
  box-shadow: inset 0 0 0 2px var(--ink), 0 6px 0 var(--ink);
}
.btn--ghost:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 2px var(--ink), 0 8px 0 var(--ink); }
.btn--ghost:active { transform: translateY(5px); box-shadow: inset 0 0 0 2px var(--ink), 0 1px 0 var(--ink); }
.btn--big { font-family: var(--font-display); font-weight: 700; font-size: 20px; padding: 20px 30px; }
.btn__arrow { transition: transform .2s var(--ease-out); }
.btn:hover .btn__arrow { transform: translateX(4px); }

.eyebrow {
  display: inline-flex;
  align-self: flex-start;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--red);
  color: #fff;
  font-weight: 900;
  font-size: 13px;
  line-height: 1;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(28px, 4.2vw, 44px);
  line-height: 1.1;
  letter-spacing: -.01em;
}
.title em {
  font-style: normal;
  color: var(--red);
  background: linear-gradient(transparent 68%, var(--gold-tint) 68%);
}
.title em + em { color: var(--navy); }

/* ===== Екран 1: Начало ===== */
.poster {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  background: var(--card);
  border: 2px solid var(--ink);
  border-radius: 32px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.poster__art {
  position: relative;
  min-height: 420px;
  overflow: hidden;
  background: linear-gradient(180deg, var(--sky) 0%, #E6F0F3 58%, #F1EBDD 100%);
  border-right: 2px solid var(--ink);
}
.poster__body {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 40px 40px 36px;
}
.lead { margin: 0; font-size: 18px; font-weight: 700; color: var(--ink-soft); }

.art__sun {
  position: absolute;
  top: 34px; right: 44px;
  width: 72px; height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #FFE08A, var(--gold));
  box-shadow: 0 0 0 14px rgba(244, 180, 0, .14), 0 0 0 30px rgba(244, 180, 0, .07);
}
.art__cloud {
  position: absolute;
  width: 92px; height: 26px;
  border-radius: 999px;
  background: #fff;
  opacity: .95;
  animation: drift 34s linear infinite;
}
.art__cloud::before, .art__cloud::after {
  content: '';
  position: absolute;
  bottom: 8px;
  border-radius: 50%;
  background: #fff;
}
.art__cloud::before { left: 16px; width: 34px; height: 34px; }
.art__cloud::after { left: 40px; width: 42px; height: 42px; }
.art__cloud--1 { top: 66px; left: -100px; }
.art__cloud--2 { top: 124px; left: -100px; transform: scale(.7); animation-duration: 46s; animation-delay: -20s; }
.art__skyline { position: absolute; left: 0; right: 0; bottom: 46px; width: 100%; height: auto; display: block; }
.eye-wheel { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
.art__road {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 46px;
  background: var(--road);
}
.art__road::before {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 3px;
  margin-top: -1.5px;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .75) 0 18px, transparent 18px 34px);
}
.art__bus {
  position: absolute;
  left: 50%;
  bottom: 8px;
  width: 170px;
  margin-left: -85px;
  animation: busArrive 1.6s var(--ease-out) .25s both;
}
.art__bus .wheel { animation: spin .4s linear .25s 4; }
.art__bus .bus__body { animation: idle 1.6s ease-in-out 2s infinite; }
.art__bus.is-leaving { animation: busLeave .7s cubic-bezier(.55, 0, .8, .2) forwards; }
.art__bus.is-leaving .wheel { animation: spin .3s linear infinite; }
.art__bus.is-leaving .puff { animation: puff .6s ease-out infinite; }

.form {
  display: grid;
  grid-template-columns: 1fr 130px;
  gap: 14px;
  margin-top: 6px;
}
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 900; font-size: 15px; }
.field input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: #fff;
  color: var(--ink);
  font-weight: 800;
  font-size: 20px;
  line-height: 1.2;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.field input::placeholder { color: #A0A7B8; font-weight: 700; }
.field input:focus { border-color: var(--navy); box-shadow: 0 0 0 4px rgba(14, 42, 92, .15); }
.field input.is-invalid { border-color: var(--red); animation: shake .45s; }
.form__error { grid-column: 1 / -1; min-height: 1.4em; margin: -4px 0 0; color: var(--red-deep); font-weight: 900; font-size: 15px; }
.form .btn { grid-column: 1 / -1; }

/* Автор на проекта (в горната лента, на всеки екран) */
.author {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.author__avatar {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--navy);
  color: #fff;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14px;
  box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--red);
}
.author__text { display: flex; flex-direction: column; line-height: 1.2; }
.author__label { font-size: 10.5px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.author__name { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink); white-space: nowrap; }
.author__class { font-weight: 900; font-size: 12.5px; color: var(--red); }

.site-footer {
  position: relative;
  z-index: 1;
  max-width: 980px;
  margin: 0 auto;
  padding: 0 20px 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  color: var(--ink-soft);
}
.site-footer p { margin: 0; }
.site-footer__project { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; }
.site-footer__legal { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; font-size: 13px; font-weight: 600; }
.site-footer strong { color: var(--ink); font-weight: 900; }
.site-footer a {
  color: var(--ink);
  font-weight: 800;
  text-decoration: underline;
  text-decoration-color: var(--red);
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
}
.site-footer a:hover { color: var(--red); }
.site-footer a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.site-footer .brand__mark { width: 22px; height: 22px; border-width: 5px; }
.site-footer .brand__mark::after { left: -8px; right: -8px; height: 5px; }

/* ===== Екран 2: Въпросите ===== */
.route {
  background: var(--card);
  border: 2px solid var(--ink);
  border-radius: 24px;
  padding: 12px 16px 10px;
  box-shadow: var(--shadow-sm);
}
.route__inner {
  position: relative;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 92px;
}
.route__road {
  position: absolute;
  left: 0; right: 0; bottom: 4px;
  height: 22px;
  border-radius: 11px;
  background: var(--road);
}
.route__road::after {
  content: '';
  position: absolute;
  left: 12px; right: 12px; top: 50%;
  height: 2px;
  margin-top: -1px;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .6) 0 10px, transparent 10px 20px);
}
.route__track { position: relative; flex: 1; height: 100%; }
.route__stop {
  position: absolute;
  bottom: 10px;
  left: calc(var(--bus-w) / 2 + var(--k) * (100% - var(--bus-w)));
  width: 10px; height: 10px;
  margin-left: -5px;
  border-radius: 50%;
  background: #6B7385;
  box-shadow: 0 0 0 2px var(--road);
  z-index: 1;
  transition: background .3s ease .75s, transform .3s ease .75s;
}
.route__stop.is-correct { background: #3DDC84; transform: scale(1.25); }
.route__stop.is-wrong { background: #FF5A6A; transform: scale(1.25); }
.route__bus {
  position: absolute;
  bottom: 9px;
  left: calc(var(--p, 0) * (100% - var(--bus-w)));
  width: var(--bus-w);
  z-index: 2;
  transition: left .95s cubic-bezier(.45, .05, .25, 1);
}
.route__finish { position: relative; z-index: 1; flex: none; width: 36px; height: 100%; }
.route__finish svg { position: absolute; bottom: 8px; left: 0; width: 36px; height: auto; }
.route.no-anim, .route.no-anim * { transition: none !important; }

.bus { display: block; width: 100%; height: auto; overflow: visible; }
.bus .wheel { transform-box: fill-box; transform-origin: center; }
.bus .puff { transform-box: fill-box; transform-origin: center; opacity: 0; }
.bus .puff--2 { animation-delay: .3s !important; }
.bus.is-driving .wheel { animation: spin .32s linear infinite; }
.bus.is-driving .bus__body { animation: bob .2s ease-in-out infinite alternate; }
.bus.is-driving .puff { animation: puff .6s ease-out infinite; }

.quiz-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 24px 4px 42px;
}
.counter { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.counter b { color: var(--red); font-weight: 800; }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px 6px 9px;
  border-radius: 999px;
  font-weight: 900;
  font-size: 14px;
  line-height: 1.1;
}
.tag__icon { flex: none; display: block; }
.tag--london { background: var(--red-tint); color: var(--red-deep); }
.tag--london .tag__icon { width: 10px; height: 18px; }
.tag--england { background: var(--navy-tint); color: var(--navy); }
.tag--england .tag__icon { width: 21px; height: 13px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .15); }
.points {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px 6px 10px;
  border-radius: 999px;
  background: var(--gold-tint);
  color: #7A5600;
  font-weight: 900;
  font-size: 15px;
}
.points svg { width: 18px; height: 18px; color: var(--gold); }
.points.is-bump { animation: bump .55s var(--ease-out); }

.qcard {
  position: relative;
  background: var(--card);
  border: 2px solid var(--ink);
  border-radius: 28px;
  padding: 36px 34px 26px;
  box-shadow: var(--shadow);
}
.qcard.is-entering { animation: cardIn .5s var(--ease-out) both; }
.roundel {
  position: absolute;
  top: -30px; right: 34px;
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 11px solid var(--red);
  background: var(--card);
}
.roundel__bar {
  position: absolute;
  left: -22px; right: -22px; top: 50%;
  transform: translateY(-50%);
  padding: 5px 0 4px;
  border-radius: 2px;
  background: var(--navy);
  color: #fff;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14px;
  line-height: 1;
  text-align: center;
}
.qcard__text {
  margin: 0 70px 26px 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(22px, 3.1vw, 31px);
  line-height: 1.22;
}
.answers { display: grid; gap: 12px; }
.answer {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  padding: 14px 18px 14px 14px;
  border-radius: 18px;
  border: 2px solid var(--line);
  background: #fff;
  box-shadow: 0 4px 0 var(--line);
  color: var(--ink);
  font-weight: 800;
  font-size: 20px;
  line-height: 1.3;
  text-align: left;
  cursor: pointer;
  transition: transform .15s var(--ease-out), border-color .2s, background .2s, box-shadow .15s, opacity .3s;
}
.answer:hover:not(:disabled) { border-color: var(--navy); transform: translateY(-2px); box-shadow: 0 6px 0 rgba(14, 42, 92, .3); }
.answer:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(14, 42, 92, .3); }
.answer:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.answer:disabled { cursor: default; }
.answer__letter {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 2px solid var(--navy);
  background: var(--paper);
  color: var(--navy);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 17px;
  transition: background .2s, color .2s, border-color .2s;
}
.answer__text { flex: 1; }
.answer__mark { flex: none; display: none; width: 30px; height: 30px; }
.answer.is-correct { background: var(--green-tint); border-color: var(--green); box-shadow: 0 4px 0 var(--green); }
.answer.is-correct .answer__letter { background: var(--green); border-color: var(--green); color: #fff; }
.answer.is-correct .answer__mark--ok { display: block; color: var(--green); }
.answer.is-wrong { background: var(--red-tint); border-color: var(--red); box-shadow: 0 4px 0 var(--red); }
.answer.is-wrong .answer__letter { background: var(--red); border-color: var(--red); color: #fff; }
.answer.is-wrong .answer__mark--bad { display: block; color: var(--red); }
.answer.is-dim { opacity: .45; }
.answer.is-picked.is-correct { animation: pop .5s var(--ease-out); }
.answer.is-picked.is-wrong { animation: shake .45s; }
.qcard.is-entering .answer { animation: answerIn .45s var(--ease-out) both; animation-delay: calc(.12s + var(--i) * .07s); }

.qcard__footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px 18px;
  min-height: 62px;
  margin-top: 22px;
}
.hint { margin: 0; color: var(--ink-soft); font-weight: 700; font-size: 15px; }
.feedback {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  font-weight: 900;
  font-size: 19px;
  animation: fadeUp .35s var(--ease-out) both;
}
.feedback svg { flex: none; width: 30px; height: 30px; padding: 5px; border-radius: 50%; color: #fff; }
.feedback--ok { color: var(--green); }
.feedback--ok svg { background: var(--green); }
.feedback--bad { color: var(--red-deep); }
.feedback--bad svg { background: var(--red); }
.qcard__footer .btn { margin-left: auto; animation: fadeUp .35s var(--ease-out) .1s both; }

/* ===== Екран 3: Резултат ===== */
.result-hero {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 34px;
  padding: 36px 40px;
  border-radius: 32px;
  background: var(--navy);
  color: #fff;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.result-hero__flag {
  position: absolute;
  right: -90px; top: -60px;
  width: 460px; height: 230px;
  opacity: .1;
  transform: rotate(-12deg);
  pointer-events: none;
}
.result-hero > *:not(.result-hero__flag) { position: relative; }
.result-hero .eyebrow { background: var(--gold); color: var(--ink); }
.result-hero .title { color: #fff; margin-top: 12px; }
.result-hero__sub { margin: 8px 0 0; font-weight: 800; font-size: 18px; opacity: .9; }
.result-hero__sub span + span::before { content: '·'; margin: 0 10px; opacity: .6; }
.rank {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
  padding: 10px 18px 10px 12px;
  border-radius: 16px;
  background: rgba(255, 255, 255, .1);
  border: 2px solid rgba(255, 255, 255, .25);
  animation: popIn .6s var(--ease-out) .9s both;
}
.rank__icon { font-size: 30px; line-height: 1; }
.rank__title { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--gold); }
.rank__note { display: block; font-weight: 700; font-size: 14px; opacity: .85; }

.score { position: relative; width: 170px; height: 170px; }
.score__ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.score__track { fill: none; stroke: rgba(255, 255, 255, .14); stroke-width: 14; }
.score__fill {
  fill: none;
  stroke: var(--red);
  stroke-width: 14;
  stroke-linecap: round;
  transition: stroke-dashoffset 1.2s var(--ease-out) .2s;
}
.score__num {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  font-family: var(--font-display);
  line-height: 1;
}
.score__num b { font-size: 52px; font-weight: 800; }
.score__num span { font-size: 16px; font-weight: 600; opacity: .7; margin-top: 4px; }

.section { margin-top: 40px; }
.section-title {
  margin: 0 0 8px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(22px, 3vw, 30px);
  line-height: 1.15;
}
.section-lead { margin: 0 0 20px; max-width: 66ch; color: var(--ink-soft); font-weight: 700; }

.symbols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.symbol-card {
  background: var(--card);
  border: 2px solid var(--ink);
  border-radius: 24px;
  padding: 20px 20px 18px;
  box-shadow: var(--shadow-sm);
}
.symbol-card__title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 16px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
}
.symbol-card__row { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; align-items: start; }
.symbol { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.symbol__visual { display: flex; align-items: center; justify-content: center; width: 100%; height: 140px; }
.symbol__flag {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 4px;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .12), 0 10px 18px -8px rgba(19, 33, 63, .45);
  transform-origin: left center;
  animation: wave 3.2s ease-in-out infinite;
}
.symbol__arms { display: block; height: 132px; width: auto; max-width: 100%; object-fit: contain; filter: drop-shadow(0 8px 8px rgba(19, 33, 63, .25)); }
.symbol figcaption { font-size: 14px; font-weight: 700; line-height: 1.35; color: var(--ink-soft); }

.anthem {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 18px 22px;
  margin-top: 18px;
  padding: 22px 26px;
  border-radius: 24px;
  background: linear-gradient(135deg, #17387A, var(--navy) 70%);
  color: #fff;
  box-shadow: var(--shadow);
}
.anthem__btn {
  display: grid;
  place-items: center;
  width: 78px; height: 78px;
  border: 0;
  border-radius: 50%;
  background: var(--red);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 6px 0 var(--red-deep), 0 0 0 7px rgba(255, 255, 255, .12);
  transition: transform .15s var(--ease-out), box-shadow .15s;
}
.anthem__btn:hover { transform: translateY(-2px) scale(1.03); }
.anthem__btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--red-deep), 0 0 0 7px rgba(255, 255, 255, .12); }
.anthem__btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 6px; }
.anthem__btn svg { width: 32px; height: 32px; }
.anthem__icon-pause { display: none; }
.anthem.is-playing .anthem__icon-play { display: none; }
.anthem.is-playing .anthem__icon-pause { display: block; }
.anthem__head { display: flex; align-items: center; gap: 12px; }
.anthem__title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.2; }
.anthem__by { margin: 4px 0 12px; font-weight: 700; font-size: 14px; opacity: .75; }
.anthem__bar { display: flex; align-items: center; gap: 14px; }
.anthem__time { min-width: 86px; text-align: right; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.anthem__range {
  flex: 1;
  height: 8px;
  margin: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--gold) var(--fill, 0%), rgba(255, 255, 255, .22) var(--fill, 0%));
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
  outline: none;
}
.anthem__range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .45);
}
.anthem__range::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: #fff; }
.anthem__range:focus-visible { outline: 3px solid var(--gold); outline-offset: 5px; }
.anthem__eq { display: inline-flex; align-items: flex-end; gap: 3px; height: 18px; }
.anthem__eq i { display: block; width: 4px; height: 25%; border-radius: 2px; background: var(--gold); }
.anthem.is-playing .anthem__eq i { animation: eq .9s ease-in-out infinite; }
.anthem.is-playing .anthem__eq i:nth-child(2) { animation-delay: -.3s; }
.anthem.is-playing .anthem__eq i:nth-child(3) { animation-delay: -.6s; }
.anthem.is-playing .anthem__eq i:nth-child(4) { animation-delay: -.15s; }
.anthem__fact {
  grid-column: 1 / -1;
  margin: 0;
  padding-top: 16px;
  border-top: 1px solid rgba(255, 255, 255, .16);
  font-weight: 700;
  font-size: 15px;
  opacity: .9;
}

.review { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.review-item {
  position: relative;
  padding: 20px 22px;
  border-radius: 22px;
  border: 2px solid var(--line);
  border-left: 9px solid var(--green);
  background: var(--card);
  box-shadow: var(--shadow-sm);
  animation: fadeUp .5s var(--ease-out) both;
  animation-delay: calc(var(--i) * 50ms);
}
.review-item.is-wrong { border-left-color: var(--red); }
.review-item__head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.review-item__num {
  display: grid;
  place-items: center;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 13px;
}
.review-item__status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
  padding: 5px 12px 5px 8px;
  border-radius: 999px;
  font-weight: 900;
  font-size: 14px;
}
.review-item__status svg { width: 18px; height: 18px; }
.review-item.is-correct .review-item__status { background: var(--green-tint); color: var(--green); }
.review-item.is-wrong .review-item__status { background: var(--red-tint); color: var(--red-deep); }
.review-item__q { margin: 0 0 10px; font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.3; }
.review-item__answer, .review-item__yours { margin: 0; font-weight: 700; }
.review-item__answer strong { color: var(--green); font-weight: 900; }
.review-item__yours { margin-top: 2px; color: var(--ink-soft); }
.review-item__yours s { color: var(--red-deep); text-decoration-thickness: 2px; }
.review-item__fact {
  display: flex;
  gap: 10px;
  margin: 14px 0 0;
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--gold-tint);
  font-weight: 600;
  font-size: 17px;
}
.review-item__fact svg { flex: none; width: 24px; height: 24px; color: #B07C00; }
.review-item__fact b { font-weight: 900; }

.result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 36px; }
.credits { max-width: 72ch; margin: 30px auto 0; text-align: center; font-size: 13px; font-weight: 600; color: var(--ink-soft); }

/* ===== Анимации ===== */
@keyframes screenIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes cardIn { from { opacity: 0; transform: translateX(40px) rotate(1deg); } to { opacity: 1; transform: none; } }
@keyframes answerIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes popIn { from { opacity: 0; transform: scale(.7); } 70% { transform: scale(1.05); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-1.2px); } }
@keyframes idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.8px); } }
@keyframes puff { 0% { opacity: .9; transform: translate(0, 0) scale(.6); } 100% { opacity: 0; transform: translate(-16px, -6px) scale(1.6); } }
@keyframes busArrive { from { transform: translateX(-460px); } to { transform: translateX(0); } }
@keyframes busLeave { from { transform: translateX(0); } to { transform: translateX(520px); } }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(760px); } }
@keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }
@keyframes wave { 0%, 100% { transform: perspective(500px) rotateY(0deg); } 50% { transform: perspective(500px) rotateY(-9deg); } }

/* ===== Малки екрани ===== */
@media (max-width: 820px) {
  .poster { grid-template-columns: 1fr; }
  .poster__art { min-height: 250px; border-right: 0; border-bottom: 2px solid var(--ink); }
  .art__bus { width: 130px; margin-left: -65px; }
  .poster__body { padding: 28px 24px 26px; }
}
@media (max-width: 760px) {
  .brand__text { display: none; }
  .symbols { grid-template-columns: 1fr; }
  .result-hero { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 30px 22px; gap: 20px; }
  .result-hero .eyebrow { align-self: center; }
}
@media (max-width: 560px) {
  :root { --bus-w: 60px; }
  body { font-size: 17px; }
  .topbar { padding-top: 20px; }
  /* На телефон: само инициалите. Текстът остава скрит за екранни четци */
  .author__text {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  .author__avatar { width: 40px; height: 40px; font-size: 13px; }
  .site-footer__sep { display: none; }
  .form { grid-template-columns: 1fr; }
  .qcard { padding: 34px 18px 20px; border-radius: 24px; }
  .qcard__text { margin-right: 0; }
  .roundel { right: 20px; }
  .answer { font-size: 18px; gap: 12px; }
  .answer__letter { width: 38px; height: 38px; }
  .qcard__footer .btn { width: 100%; }
  .points { margin-left: 0; }
  .anthem { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .anthem__head { justify-content: center; }
  .anthem__bar { width: 100%; }
  .symbol-card__row { grid-template-columns: 1fr 1fr; }
  .symbol__arms { height: 104px; }
  .symbol__visual { height: 110px; }
}
@media (hover: none) { .hint { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<div class="tube-stripe" aria-hidden="true"></div>

    <span class="brand__mark" aria-hidden="true"></span>

    </span>

</header>

<main class="app">

  <!-- ========== Екран 1: Начало ========== -->
  <section class="screen" id="screen-start" data-screen="start">
    <div class="poster">
      <div class="poster__art" aria-hidden="true">
        <div class="art__sun"></div>
        <div class="art__cloud art__cloud--1"></div>
        <div class="art__cloud art__cloud--2"></div>

        <!-- Силуетът на Лондон -->
        <svg class="art__skyline" viewBox="0 0 600 230" preserveAspectRatio="xMidYMax meet">

          </g>
          <g fill="#13213F">
            <!-- Биг Бен -->
            <polygon points="62,6 72,44 52,44"/>

            <rect x="72" y="158" width="118" height="54"/>

  const createStore = (initial) => {
    let state = initial;
    const listeners = [];
    return {
      get: () => state,
      update: (patch) => {
        const prev = state;
        state = { ...state, ...(typeof patch === 'function' ? patch(state) : patch) };
        listeners.forEach((fn) => fn(state, prev));
      },
      subscribe: (fn) => listeners.push(fn),
    };
  };

  /* ================= Звуци (създават се от браузъра, без файлове) ================= */
  const createSfx = () => {
    let ctx = null;
    const getCtx = () => {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      ctx = ctx || new AudioCtx();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    };
    const tone = ({ freq, at = 0, dur = 0.15, type = 'sine', vol = 0.18, slideTo }) => {
      const c = getCtx();
      if (!c) return;
      const start = c.currentTime + at;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, start);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, start + dur);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(vol, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain).connect(c.destination);
      osc.start(start);
      osc.stop(start + dur + 0.05);
    };
    const play = (notes) => notes.forEach(tone);
    return {
      correct: () => play([
        { freq: 659, dur: 0.14 },
        { freq: 880, at: 0.1, dur: 0.16 },
        { freq: 1319, at: 0.2, dur: 0.32 },
      ]),
      wrong: () => play([
        { freq: 330, dur: 0.2, type: 'triangle', slideTo: 260 },
        { freq: 247, at: 0.18, dur: 0.34, type: 'triangle', slideTo: 180 },
      ]),
      horn: () => play([
        { freq: 392, dur: 0.14, type: 'square', vol: 0.05 },
        { freq: 494, dur: 0.14, type: 'square', vol: 0.05 },
        { freq: 392, at: 0.2, dur: 0.24, type: 'square', vol: 0.05 },
        { freq: 494, at: 0.2, dur: 0.24, type: 'square', vol: 0.05 },
      ]),
    };
  };

  /* ================= Плейър за химна ================= */
  const createAnthemPlayer = ({ root, sourceEl }) => {
    const audio = new Audio();
    audio.preload = 'metadata';
    const btn = $(SEL.ANTHEM_BTN, root);
    const slider = $(SEL.ANTHEM_RANGE, root);
    const time = $(SEL.ANTHEM_TIME, root);
    let loaded = false;
    let lang = LANG.BG;

    // Превръща вградения текст (base64) обратно в аудио файл
    const load = () => {
      if (loaded) return;
      loaded = true;
      const binary = atob(sourceEl.textContent.replace(/\s+/g, ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      audio.src = URL.createObjectURL(new Blob([bytes], { type: AUDIO_MIME }));
    };

    const sync = () => {
      const duration = Number.isFinite(audio.duration) ? audio.duration : 0;
      const pct = duration ? (audio.currentTime / duration) * 100 : 0;
      slider.value = String(pct);
      slider.style.setProperty('--fill', `${pct}%`);
      time.textContent = `${formatTime(audio.currentTime)} / ${formatTime(duration)}`;
    };

    const syncButton = () => {
      const playing = !audio.paused;
      root.classList.toggle(CLS.PLAYING, playing);
      btn.setAttribute('aria-pressed', String(playing));
      btn.setAttribute('aria-label', tr(lang, playing ? 'anthem.pause' : 'anthem.play'));
    };

    audio.addEventListener('play', syncButton);
    audio.addEventListener('pause', syncButton);
    audio.addEventListener('timeupdate', sync);
    audio.addEventListener('loadedmetadata', sync);
    audio.addEventListener('ended', () => {
      audio.currentTime = 0;
      sync();
    });

    btn.addEventListener('click', () => {
      load();
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    });

    slider.addEventListener('input', () => {
      load();
      if (Number.isFinite(audio.duration)) audio.currentTime = (Number(slider.value) / 100) * audio.duration;
      sync();
    });

    return {
      prepare: load,
      stop: () => {
        audio.pause();
        if (loaded) audio.currentTime = 0;
        sync();
      },
      setLang: (next) => {
        lang = next;
        syncButton();
      },
    };
  };

  /* ================= Рисуване на екраните ================= */
  const staticVars = (lang) => ({
    n: QUESTIONS.length,
    author: AUTHOR.name[lang],
    initials: AUTHOR.initials[lang],
    grade: AUTHOR.grade[lang],
    helper: HELPER.name[lang],
    helperUrl: HELPER.url,
    year: COPYRIGHT_YEAR,
  });
  const SCORE_CIRCUMFERENCE = 2 * Math.PI * SCORE_RADIUS;

  const applyStaticTexts = (lang) => {
    const vars = staticVars(lang);
    $$(`[${I18N_ATTR.TEXT}]`).forEach((el) => { el.textContent = tr(lang, el.getAttribute(I18N_ATTR.TEXT), vars); });
    // Само за наши, предварително написани текстове (никога за написаното от играча)
    $$(`[${I18N_ATTR.HTML}]`).forEach((el) => { el.innerHTML = tr(lang, el.getAttribute(I18N_ATTR.HTML), vars); });
    $$(`[${I18N_ATTR.PLACEHOLDER}]`).forEach((el) => { el.placeholder = tr(lang, el.getAttribute(I18N_ATTR.PLACEHOLDER)); });
    $$(`[${I18N_ATTR.ARIA}]`).forEach((el) => { el.setAttribute('aria-label', tr(lang, el.getAttribute(I18N_ATTR.ARIA))); });
    $$(`[${I18N_ATTR.ALT}]`).forEach((el) => { el.alt = tr(lang, el.getAttribute(I18N_ATTR.ALT)); });
    document.documentElement.lang = lang;
    document.title = tr(lang, 'docTitle');
  };

  const renderSwitch = (lang) => {
    $(SEL.LANG_SWITCH).setAttribute('aria-checked', String(lang === LANG.EN));
    $$(SEL.LANG_OPT).forEach((el) => el.classList.toggle(CLS.ON, el.dataset.langOpt === lang));
  };

  const showScreen = (screen) => {
    $$(SEL.SCREEN).forEach((el) => el.classList.toggle(CLS.ACTIVE, el.dataset.screen === screen));
    window.scrollTo(0, 0);
  };

  const createRouteView = () => {
    const route = $(SEL.ROUTE);
    const track = $(SEL.ROUTE_TRACK);
    const busHolder = $(SEL.ROUTE_BUS);
    busHolder.innerHTML = BUS_SVG;
    $(SEL.ROUTE_FINISH).innerHTML = BIG_BEN_SVG;
    const bus = $(SEL.BUS_SVG, busHolder);
    const stops = range(QUESTIONS.length).map((i) => {
      const stop = document.createElement('span');
      stop.className = 'route__stop';
      stop.style.setProperty('--k', String((i + 1) / QUESTIONS.length));
      track.insertBefore(stop, busHolder);
      return stop;
    });
    let driveTimer = 0;

    return (state, drive) => {
      if (!drive) route.classList.add(CLS.NO_ANIM);
      const answered = countAnswered(state.answers);
      busHolder.style.setProperty('--p', String(answered / state.order.length));
      stops.forEach((stop, i) => {
        const qIndex = state.order[i];
        const chosen = state.answers[qIndex];
        const done = chosen !== undefined;
        stop.classList.toggle(CLS.CORRECT, done && isCorrect(qIndex, chosen));
        stop.classList.toggle(CLS.WRONG, done && !isCorrect(qIndex, chosen));
      });
      if (drive) {
        bus.classList.add(CLS.DRIVING);
        clearTimeout(driveTimer);
        driveTimer = setTimeout(() => bus.classList.remove(CLS.DRIVING), DRIVE_MS);
      } else {
        void route.offsetWidth;
        route.classList.remove(CLS.NO_ANIM);
      }
    };
  };

  const renderMeta = (state, bump) => {
    const { lang, order, current, answers } = state;
    const qIndex = order[current];
    $(SEL.COUNTER).innerHTML = tr(lang, 'quiz.counter', { i: current + 1, n: order.length });
    $(SEL.TAG).innerHTML = tagHtml(QUESTIONS[qIndex].category, lang);
    $(SEL.POINTS_TEXT).textContent = tr(lang, 'quiz.points', { s: countScore(answers) });
    if (bump) restartAnimation($(SEL.POINTS), CLS.BUMP);
  };

  const answerHtml = ({ q, optIdx, pos, lang, chosen, justAnswered }) => {
    const answered = chosen !== undefined;
    const classes = ['answer'];
    if (answered) {
      if (optIdx === q.correct) classes.push(CLS.CORRECT);
      else if (optIdx === chosen) classes.push(CLS.WRONG);
      else classes.push(CLS.DIM);
      if (justAnswered && optIdx === chosen) classes.push(CLS.PICKED);
    }
    return `
      <button type="button" class="${classes.join(' ')}" data-option="${optIdx}" style="--i:${pos}" ${answered ? 'disabled' : ''}>
        <span class="answer__letter">${OPTION_LETTERS[lang][pos]}</span>
        <span class="answer__text">${escapeHtml(q.options[optIdx][lang])}</span>
        ${iconHtml(ICON.CHECK, 'answer__mark answer__mark--ok')}
        ${iconHtml(ICON.CROSS, 'answer__mark answer__mark--bad')}
      </button>`;
  };

  const footerHtml = ({ q, lang, chosen, isLast }) => {
    if (chosen === undefined) return `<p class="hint">${escapeHtml(tr(lang, 'quiz.hint'))}</p>`;
    const ok = chosen === q.correct;
    const message = ok
      ? escapeHtml(tr(lang, 'quiz.correct'))
      : tr(lang, 'quiz.wrong', { a: escapeHtml(q.options[q.correct][lang]) });
    return `
      <p class="feedback ${ok ? 'feedback--ok' : 'feedback--bad'}">
        ${iconHtml(ok ? ICON.CHECK : ICON.CROSS)}<span>${message}</span>
      </p>
      <button class="btn btn--primary" type="button" data-action="${ACTION.NEXT}">
        <span>${escapeHtml(tr(lang, isLast ? 'quiz.finish' : 'quiz.next'))}</span>
        ${iconHtml(ICON.ARROW, 'btn__arrow')}
      </button>`;
  };

  const renderQuestion = (state, { enter, justAnswered }) => {
    const { lang, order, current, optionOrder, answers } = state;
    const qIndex = order[current];
    const q = QUESTIONS[qIndex];
    const chosen = answers[qIndex];
    const card = $(SEL.QCARD);
    card.innerHTML = `
      <div class="roundel" aria-hidden="true"><span class="roundel__bar">${current + 1}</span></div>
      <h2 class="qcard__text">${escapeHtml(q.text[lang])}</h2>
      <div class="answers">
        ${optionOrder[qIndex].map((optIdx, pos) => answerHtml({ q, optIdx, pos, lang, chosen, justAnswered })).join('')}
      </div>
      <div class="qcard__footer">
        ${footerHtml({ q, lang, chosen, isLast: current === order.length - 1 })}
      </div>`;
    if (enter) restartAnimation(card, CLS.ENTERING);
    else card.classList.remove(CLS.ENTERING);
    if (justAnswered) $(SEL.ACTION, card)?.focus({ preventScroll: true });
  };

  const reviewItemHtml = (qIndex, pos, state) => {
    const { lang, answers } = state;
    const q = QUESTIONS[qIndex];
    const chosen = answers[qIndex];
    const ok = isCorrect(qIndex, chosen);
    const yours = !ok && chosen !== undefined
      ? `<p class="review-item__yours">${escapeHtml(tr(lang, 'review.yours'))} <s>${escapeHtml(q.options[chosen][lang])}</s></p>`
      : '';
    return `
      <li class="review-item ${ok ? CLS.CORRECT : CLS.WRONG}" style="--i:${pos}">
        <div class="review-item__head">
          <span class="review-item__num">${pos + 1}</span>
          ${tagHtml(q.category, lang)}
          <span class="review-item__status">${iconHtml(ok ? ICON.CHECK : ICON.CROSS)}${escapeHtml(tr(lang, ok ? 'review.ok' : 'review.bad'))}</span>
        </div>
        <h3 class="review-item__q">${escapeHtml(q.text[lang])}</h3>
        <p class="review-item__answer">${escapeHtml(tr(lang, 'review.correct'))} <strong>${escapeHtml(q.options[q.correct][lang])}</strong></p>
        ${yours}
        <p class="review-item__fact">${iconHtml(ICON.BULB)}<span><b>${escapeHtml(tr(lang, 'review.fact'))}</b> ${escapeHtml(q.fact[lang])}</span></p>
      </li>`;
  };

  const animateScore = (score, total) => {
    const fill = $(SEL.SCORE_FILL);
    const num = $(SEL.SCORE_NUM);
    fill.style.transition = 'none';
    fill.style.strokeDasharray = String(SCORE_CIRCUMFERENCE);
    fill.style.strokeDashoffset = String(SCORE_CIRCUMFERENCE);
    void fill.getBoundingClientRect();
    fill.style.transition = '';
    fill.style.strokeDashoffset = String(SCORE_CIRCUMFERENCE * (1 - score / total));

    const startedAt = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - startedAt) / SCORE_ANIM_MS);
      const eased = 1 - (1 - t) ** 3;
      num.textContent = String(Math.round(eased * score));
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };

  const renderResult = (state, intro) => {
    const { lang, order, answers, player } = state;
    const total = order.length;
    const score = countScore(answers);
    const rank = getRank(score, total);

    $(SEL.HEADLINE).textContent = format(rank.headline[lang], { name: player.name });
    $(SEL.RESULT_GRADE).textContent = tr(lang, 'result.grade', { g: player.grade });
    $(SEL.RESULT_SCORE).textContent = tr(lang, 'result.score', { s: score, n: total });
    $(SEL.RANK_ICON).textContent = rank.icon;
    $(SEL.RANK_TITLE).textContent = rank.title[lang];
    $(SEL.RANK_NOTE).textContent = rank.note[lang];
    $(SEL.SCORE_TOTAL).textContent = `/ ${total}`;
    $(SEL.REVIEW).innerHTML = order.map((qIndex, pos) => reviewItemHtml(qIndex, pos, state)).join('');

    if (intro) animateScore(score, total);
  };

  /* ================= Стартиране ================= */
  const init = () => {
    const store = createStore({
      lang: LANG.BG,
      screen: SCREEN.START,
      player: { name: '', grade: '' },
      order: [],
      optionOrder: {},
      current: 0,
      answers: {},
    });
    const sfx = createSfx();
    const anthem = createAnthemPlayer({ root: $(SEL.ANTHEM), sourceEl: $(SEL.ANTHEM_DATA) });
    const renderRoute = createRouteView();
    const posterBus = $(SEL.POSTER_BUS);
    const nameInput = $(SEL.NAME);
    const gradeInput = $(SEL.GRADE);
    const errorEl = $(SEL.START_ERROR);
    let starting = false;

    posterBus.innerHTML = BUS_SVG;

    const render = (state, prev) => {
      const langChanged = state.lang !== prev.lang;
      const screenChanged = state.screen !== prev.screen;

      if (langChanged) {
        applyStaticTexts(state.lang);
        renderSwitch(state.lang);
        anthem.setLang(state.lang);
      }
      if (screenChanged) {
        if (prev.screen === SCREEN.RESULT) anthem.stop();
        showScreen(state.screen);
      }

      if (state.screen === SCREEN.QUIZ) {
        const newGame = state.order !== prev.order;
        const moved = newGame || screenChanged || state.current !== prev.current;
        const answeredNow = !moved && countAnswered(state.answers) > countAnswered(prev.answers);
        if (moved || answeredNow || langChanged) {
          const lastPick = answeredNow ? state.answers[state.order[state.current]] : undefined;
          renderMeta(state, answeredNow && isCorrect(state.order[state.current], lastPick));
          renderQuestion(state, { enter: moved, justAnswered: answeredNow });
        }
        if (moved || answeredNow) renderRoute(state, answeredNow);
        if (moved && !screenChanged) window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      if (state.screen === SCREEN.RESULT && (screenChanged || langChanged)) {
        renderResult(state, screenChanged);
        if (screenChanged) anthem.prepare();
      }
    };

    store.subscribe(render);

    /* --- Действия --- */
    const showError = (key, input) => {
      errorEl.setAttribute(I18N_ATTR.TEXT, key);
      errorEl.textContent = tr(store.get().lang, key);
      restartAnimation(input, CLS.INVALID);
      input.focus();
    };

    const clearError = () => {
      errorEl.removeAttribute(I18N_ATTR.TEXT);
      errorEl.textContent = '';
      [nameInput, gradeInput].forEach((input) => input.classList.remove(CLS.INVALID));
    };

    const startGame = (event) => {
      event.preventDefault();
      if (starting) return;
      const name = nameInput.value.trim();
      const grade = gradeInput.value.trim();
      if (!name) return showError('start.errName', nameInput);
      if (!grade) return showError('start.errGrade', gradeInput);
      clearError();
      starting = true;
      sfx.horn();
      posterBus.classList.add(CLS.LEAVING);
      setTimeout(() => {
        starting = false;
        store.update((s) => ({ ...createGame(s.order), player: { name, grade }, screen: SCREEN.QUIZ }));
      }, LEAVE_MS);
    };

    const choose = (optIdx) => {
      const state = store.get();
      const qIndex = state.order[state.current];
      if (state.screen !== SCREEN.QUIZ || state.answers[qIndex] !== undefined) return;
      if (isCorrect(qIndex, optIdx)) sfx.correct();
      else sfx.wrong();
      store.update({ answers: { ...state.answers, [qIndex]: optIdx } });
    };

    const next = () => {
      const state = store.get();
      const qIndex = state.order[state.current];
      if (state.answers[qIndex] === undefined) return;
      if (state.current < state.order.length - 1) store.update({ current: state.current + 1 });
      else store.update({ screen: SCREEN.RESULT });
    };

    const playAgain = () => store.update((s) => ({ ...createGame(s.order), screen: SCREEN.QUIZ }));

    const newPlayer = () => {
      nameInput.value = '';
      clearError();
      posterBus.classList.remove(CLS.LEAVING);
      // Екранът „Начало“ се показва наново, затова автобусът пак пристига сам
      store.update({ screen: SCREEN.START, player: { name: '', grade: gradeInput.value } });
      nameInput.focus({ preventScroll: true });
    };

    const ACTIONS = Object.freeze({
      [ACTION.NEXT]: next,
      [ACTION.AGAIN]: playAgain,
      [ACTION.NEW_PLAYER]: newPlayer,
    });

    /* --- Събития --- */
    $(SEL.START_FORM).addEventListener('submit', startGame);
    [nameInput, gradeInput].forEach((input) => input.addEventListener('input', () => input.classList.remove(CLS.INVALID)));

    $(SEL.LANG_SWITCH).addEventListener('click', () => {
      store.update((s) => ({ lang: s.lang === LANG.BG ? LANG.EN : LANG.BG }));
    });

    document.addEventListener('click', (event) => {
      const answer = event.target.closest(SEL.ANSWER);
      if (answer && !answer.disabled) return choose(Number(answer.dataset.option));
      const actionEl = event.target.closest(SEL.ACTION);
      if (actionEl) ACTIONS[actionEl.dataset.action]?.();
    });

    document.addEventListener('keydown', (event) => {
      const state = store.get();
      if (state.screen !== SCREEN.QUIZ || event.altKey || event.ctrlKey || event.metaKey) return;
      const qIndex = state.order[state.current];
      const answered = state.answers[qIndex] !== undefined;
      const pos = OPTION_KEYS[(event.key || '').toLowerCase()];
      if (!answered && pos !== undefined) {
        choose(state.optionOrder[qIndex][pos]);
      } else if (answered && event.key === NEXT_KEY) {
        next();
      }
    });

    // Първоначално рисуване
    render(store.get(), { answers: {} });
  };

  init();
})();
</script>
</body>
</html>
